name: Gauge LLM eval gate
description: Run a Gauge eval suite, compare it with the baseline and fail the job on a quality, cost or latency regression.
branding:
  icon: bar-chart-2
  color: green

inputs:
  config:
    description: Path to gauge.yml
    default: gauge.yml
  baseline:
    description: Baseline results file (committed). If it does not exist and `server` is set, the latest main run is used.
    default: gauge-baseline.json
  working-directory:
    description: Directory to run in
    default: .
  server:
    description: Gauge server URL to fetch the baseline from and upload the run to (optional)
    default: ""
  token:
    description: Ingest token for the Gauge server (optional)
    default: ""
  python-version:
    description: Python version
    default: "3.12"
  extra-requirements:
    description: Extra pip requirements needed by the app under test (space separated)
    default: ""
  comment:
    description: Post the report as a PR comment (needs pull-requests write permission)
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Gauge
      shell: bash
      run: |
        python -m pip install --quiet "${{ github.action_path }}" ${{ inputs.extra-requirements }}
    - name: Run the eval and compare with the baseline
      id: gauge
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GAUGE_SERVER: ${{ inputs.server }}
        GAUGE_TOKEN: ${{ inputs.token }}
      run: |
        set +e
        gauge ci -c "${{ inputs.config }}" --baseline "${{ inputs.baseline }}" --md "$RUNNER_TEMP/gauge-report.md"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/gauge-report.md" --edit-last 2>/dev/null \
          || gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/gauge-report.md" \
          || echo "could not post the PR comment (missing pull-requests: write?)"
    - name: Fail on regression
      if: ${{ steps.gauge.outputs.exit_code != '0' }}
      shell: bash
      run: |
        echo "Gauge detected a regression (see the job summary)." >&2
        exit 1
